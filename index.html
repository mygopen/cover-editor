<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社群封面圖片編輯器</title>
    <!-- Google Fonts: Noto Sans TC (新增 600 字重) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 自定義樣式 */
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            /* 讓整個網頁的文字邊緣更平滑 (MacOS/iOS 尤其明顯) */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* 預覽區域容器比例 1000:563 (56.3%) */
        .preview-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.3%; /* 563 / 1000 * 100 */
            background-color: #333;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            user-select: none; /* 防止拖曳圖片時選取到整個區塊 */
        }

        .preview-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 背景圖片層 */
        #preview-bg-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center center;
            /* 初始值由 JS 控制 */
            cursor: move;
        }

        /* 遮罩層 (中間層) */
        #preview-mask-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://ik.imagekit.io/mygopen/cover.png?updatedAt=1765794389568');
            background-size: cover;
            background-position: center;
            pointer-events: none; /* 讓滑鼠事件穿透到背景圖以便拖曳 */
            z-index: 10;
        }

        #preview-mosaic-layer,
        #mosaic-selection-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #preview-mosaic-layer {
            z-index: 5;
        }

        #mosaic-selection-layer {
            z-index: 30;
        }

        #mosaic-selection-box {
            position: absolute;
            display: none;
            border: 2px dashed rgba(59, 130, 246, 0.95);
            background: rgba(59, 130, 246, 0.12);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
            border-radius: 4px;
        }

        #mosaic-dialog {
            position: absolute;
            left: 50%;
            bottom: 18px;
            z-index: 40;
            width: min(455px, calc(100% - 24px));
            transform: translateX(-50%);
            overflow: hidden;
            border-radius: 5px;
            background: #474747;
            color: #f3f4f6;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }

        .mosaic-dialog-titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 30px;
            padding: 0 10px;
            background: #343434;
            font-weight: 700;
        }

        #btn-mosaic-close {
            color: #d1d5db;
            font-size: 22px;
            line-height: 1;
        }

        .mosaic-dialog-body {
            display: grid;
            grid-template-columns: 1fr 104px;
            gap: 14px;
            padding: 14px;
        }

        .mosaic-cell-row {
            display: grid;
            grid-template-columns: auto 104px;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .mosaic-value-wrap {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            height: 27px;
            padding: 0 8px;
            border-radius: 3px;
            background: #292929;
        }

        #inp-mosaic-cell-size {
            width: 54px;
            border: 0;
            outline: 0;
            background: transparent;
            color: #f9fafb;
            text-align: right;
        }

        #inp-mosaic-dialog-slider {
            width: 100%;
            accent-color: #8b8b8b;
        }

        .mosaic-dialog-actions {
            display: grid;
            gap: 8px;
        }

        .mosaic-dialog-actions button {
            height: 26px;
            border-radius: 3px;
            background: #696969;
            color: #f9fafb;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .mosaic-dialog-actions button:hover {
            background: #747474;
        }

        .mosaic-preview-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            font-size: 14px;
        }

        /* 文字層 (最上層) */
        #preview-text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; /* 文字層本身不擋住拖曳 */
            padding: 0 5%; /* 左右留白 */
            /* padding-bottom 由 JS 動態控制 */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 文字靠下 */
            align-items: center;       /* 水平置中 */
        }

        /* 上標文字 */
        .top-label {
            display: block; 
            width: 100%;    
            text-align: center !important; 
            color: white;
            font-weight: 600; /* 修改為 600 */
            line-height: 1.3;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 0.05em; /* 這裡有字距 */
            /* transform 由 JS 控制位移 */
        }

        /* 下標主要文字 */
        .bottom-label {
            display: block; 
            width: 100%;    
            text-align: center !important; 
            color: white;
            font-weight: 800; 
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
            white-space: nowrap; 
            overflow: visible; 
        }

        /* 顏色高亮樣式 */
        .highlight-cyan {
            color: #23f8b5;
        }
        .highlight-yellow {
            color: #fef337;
        }

        /* 編輯器 UI 優化 */
        .control-group {
            @apply mb-4 p-4 bg-white rounded-lg shadow-sm border border-gray-100;
        }
        .control-label {
            @apply block text-sm font-medium text-gray-700 mb-2;
        }
        input[type=range] {
            @apply w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600;
        }
        
        /* 隱藏的 Canvas 用於輸出 */
        #export-canvas {
            display: none;
        }

        /* 載入中遮罩 */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

    <!-- 左側/上方：預覽區 -->
    <div class="w-full md:w-2/3 p-4 md:p-8 flex flex-col justify-center items-center bg-gray-100 sticky top-0 md:relative z-10">
        <div class="w-full max-w-5xl">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                <i class="fa-regular fa-image mr-2"></i> 圖片預覽
                <span class="text-xs font-normal text-gray-500 ml-2">(可拖曳背景調整位置)</span>
            </h2>
            
            <!-- 預覽框 -->
            <div class="preview-container" id="preview-container">
                <div class="preview-content">
                    <!-- 1. 背景層 -->
                    <img id="preview-bg-layer" src="" alt="背景預覽" style="display: none;">
                    <canvas id="preview-mosaic-layer"></canvas>
                    
                    <!-- 2. 遮罩層 -->
                    <div id="preview-mask-layer"></div>
                    
                    <!-- 3. 文字層 -->
                    <div id="preview-text-layer">
                        <div id="display-top-label" class="top-label">網傳炊煙裊裊升起，隔江千萬里，周杰倫我愛你</div>
                        <div id="display-bottom-label" class="bottom-label">好的！天青色等煙雨而我在等你</div>
                    </div>

                    <div id="mosaic-selection-layer">
                        <div id="mosaic-selection-box"></div>
                    </div>

                    <div id="mosaic-dialog" class="hidden" role="dialog" aria-labelledby="mosaic-dialog-title">
                        <div class="mosaic-dialog-titlebar">
                            <div id="mosaic-dialog-title">Mosaic</div>
                            <button id="btn-mosaic-close" type="button" aria-label="Close">&times;</button>
                        </div>
                        <div class="mosaic-dialog-body">
                            <div>
                                <div class="mosaic-cell-row">
                                    <label for="inp-mosaic-cell-size">Cell Size:</label>
                                    <div class="mosaic-value-wrap">
                                        <input id="inp-mosaic-cell-size" type="number" min="2" max="80" value="12">
                                        <span>px</span>
                                    </div>
                                </div>
                                <input id="inp-mosaic-dialog-slider" type="range" min="2" max="80" value="12">
                            </div>
                            <div class="mosaic-dialog-actions">
                                <button id="btn-mosaic-ok" type="button">OK</button>
                                <button id="btn-mosaic-reset" type="button">Reset</button>
                                <label class="mosaic-preview-row">
                                    <input id="inp-mosaic-preview" type="checkbox" checked>
                                    Preview
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 下載按鈕 -->
            <div class="mt-6 flex justify-center">
                <button onclick="downloadImage()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105 flex items-center text-lg">
                    <i class="fa-solid fa-download mr-2"></i> 下載圖片 (1000x563)
                </button>
            </div>
            <div id="loading-msg" class="hidden mt-2 text-center text-gray-600 flex justify-center items-center gap-2">
                <div class="loader"></div> 處理中...
            </div>
        </div>
    </div>

    <!-- 右側/下方：控制區 -->
    <div class="w-full md:w-1/3 bg-white border-l border-gray-200 p-6 overflow-y-auto h-auto md:h-screen custom-scrollbar">
        <h1 class="text-2xl font-black text-gray-800 mb-6 border-b pb-4">封面編輯器</h1>

        <!-- 1. 背景圖片設定 -->
        <div class="control-group">
            <h3 class="font-bold text-gray-800 mb-3 flex items-center">
                <i class="fa-solid fa-camera mr-2 text-blue-500"></i> 背景設定
            </h3>
            
            <div class="mb-4">
                <label class="control-label">上傳圖片</label>
                <input type="file" id="bg-upload" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition"/>
            </div>

            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="control-label flex justify-between">
                        縮放 (Scale) <span id="val-scale" class="text-gray-400">100%</span>
                    </label>
                    <input type="range" id="inp-scale" min="10" max="300" value="100">
                </div>
                <div>
                    <label class="control-label flex justify-between">
                        亮度 <span id="val-brightness" class="text-gray-400">100%</span>
                    </label>
                    <input type="range" id="inp-brightness" min="0" max="200" value="100">
                </div>
                <div>
                    <label class="control-label flex justify-between">
                        飽和度 <span id="val-saturation" class="text-gray-400">100%</span>
                    </label>
                    <input type="range" id="inp-saturation" min="0" max="200" value="100">
                </div>
            </div>
        </div>

        <div class="control-group">
            <h3 class="font-bold text-gray-800 mb-3 flex items-center">
                <i class="fa-solid fa-table-cells-large mr-2 text-blue-500"></i> 馬賽克區域
            </h3>

            <div class="grid grid-cols-1 gap-4">
                <div class="grid grid-cols-1 gap-3">
                    <button id="btn-mosaic-select" type="button" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-4 rounded shadow-sm transition">
                        選取區域
                    </button>
                </div>
                <button id="btn-mosaic-clear" type="button" class="hidden text-sm text-gray-500 hover:text-gray-800 text-left">
                    清除選取
                </button>
                <p id="mosaic-status" class="text-xs text-gray-500">點選「選取區域」後，在圖片上拖曳要馬賽克的位置。</p>
            </div>
        </div>

        <!-- 2. 文字編輯 -->
        <div class="control-group">
            <h3 class="font-bold text-gray-800 mb-3 flex items-center">
                <i class="fa-solid fa-font mr-2 text-blue-500"></i> 文字編輯
            </h3>
            
            <!-- 調整滑桿 -->
            <div class="grid grid-cols-1 gap-4 mb-5 pb-5 border-b border-gray-100">
                <div>
                    <label class="control-label flex justify-between">
                        底部距離 (px) <span id="val-text-y" class="text-gray-400">100px</span>
                    </label>
                    <input type="range" id="inp-text-y" min="0" max="300" value="100">
                </div>
                <div>
                    <label class="control-label flex justify-between">
                        大標題大小 (下) <span id="val-text-size" class="text-gray-400">48px</span>
                    </label>
                    <input type="range" id="inp-text-size" min="20" max="80" value="48">
                </div>
                <div>
                    <label class="control-label flex justify-between">
                        上標題大小 (上) <span id="val-top-text-size" class="text-gray-400">30px</span>
                    </label>
                    <input type="range" id="inp-top-text-size" min="12" max="60" value="30">
                </div>
            </div>

            <!-- 上標 -->
            <div class="mb-4">
                <label class="control-label">上標題 (白色小字)</label>
                <input type="text" id="inp-top-text" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value="網傳炊煙裊裊升起，隔江千萬里，周杰倫我愛你" placeholder="輸入上標題...">
            </div>

            <!-- 下標 -->
            <div class="mb-2">
                <label class="control-label">大標題 (僅支援單行，可變色)</label>
                <!-- 工具列 -->
                <div class="flex space-x-2 mb-2">
                    <button onclick="setTextColor('white')" class="w-8 h-8 rounded border border-gray-300 bg-white hover:bg-gray-100 shadow-sm" title="重置為白色"></button>
                    <button onclick="setTextColor('cyan')" class="w-8 h-8 rounded border border-gray-300 bg-[#23f8b5] hover:opacity-80 shadow-sm" title="標記為青色"></button>
                    <button onclick="setTextColor('yellow')" class="w-8 h-8 rounded border border-gray-300 bg-[#fef337] hover:opacity-80 shadow-sm" title="標記為黃色"></button>
                    <div class="text-xs text-gray-500 flex items-center ml-2">← 選取文字後點擊顏色</div>
                </div>
                
                <!-- 可編輯 Div -->
                <div id="inp-bottom-text" contenteditable="true" class="w-full min-h-[50px] border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-800 text-lg font-bold">
                    好的！天青色等煙雨而我在等你
                </div>
            </div>
        </div>
        
    </div>

    <!-- 隱藏的 Canvas 用於生成最終圖片，尺寸更新為 1000x563 -->
    <canvas id="export-canvas" width="1000" height="563"></canvas>

    <script>
        // --- 變數與初始化 ---
        const previewContainer = document.getElementById('preview-container');
        const bgImgEl = document.getElementById('preview-bg-layer');
        const maskImgEl = document.getElementById('preview-mask-layer');
        const textLayer = document.getElementById('preview-text-layer');
        const displayTop = document.getElementById('display-top-label');
        const displayBottom = document.getElementById('display-bottom-label');
        const previewMosaicCanvas = document.getElementById('preview-mosaic-layer');
        const mosaicSelectionBox = document.getElementById('mosaic-selection-box');
        
        // 輸入控制項
        const inpScale = document.getElementById('inp-scale');
        const inpBright = document.getElementById('inp-brightness');
        const inpSat = document.getElementById('inp-saturation');
        const btnMosaicSelect = document.getElementById('btn-mosaic-select');
        const btnMosaicClear = document.getElementById('btn-mosaic-clear');
        const mosaicStatus = document.getElementById('mosaic-status');
        const mosaicDialog = document.getElementById('mosaic-dialog');
        const inpMosaicCellSize = document.getElementById('inp-mosaic-cell-size');
        const inpMosaicDialogSlider = document.getElementById('inp-mosaic-dialog-slider');
        const inpMosaicPreview = document.getElementById('inp-mosaic-preview');
        const btnMosaicOk = document.getElementById('btn-mosaic-ok');
        const btnMosaicReset = document.getElementById('btn-mosaic-reset');
        const btnMosaicClose = document.getElementById('btn-mosaic-close');
        
        const inpTextY = document.getElementById('inp-text-y');
        const inpTextSize = document.getElementById('inp-text-size');
        const inpTopTextSize = document.getElementById('inp-top-text-size'); 
        
        const inpTopText = document.getElementById('inp-top-text');
        const inpBottomText = document.getElementById('inp-bottom-text');
        
        // 狀態管理
        let state = {
            bgSrc: null,
            scale: 1,
            brightness: 100,
            saturation: 100,
            posX: 0,
            posY: 0,
            isDragging: false,
            isSelectingMosaic: false,
            isMosaicSelectionMode: false,
            startX: 0,
            startY: 0,
            mosaicStartX: 0,
            mosaicStartY: 0,
            textPaddingBottomPx: 100,
            bottomFontSize: 48,
            topFontSize: 30,
            mosaicIntensity: 12,
            pendingMosaicBox: null,
            savedMosaicBox: null
        };

        // 遮罩圖片 URL
        const maskUrl = 'https://ik.imagekit.io/mygopen/cover.png?updatedAt=1765794389568';
        const maskImageObj = new Image();
        maskImageObj.crossOrigin = "Anonymous";
        maskImageObj.src = maskUrl;
        bgImgEl.addEventListener('load', updatePreview);
        const OUTPUT_WIDTH = 1000;
        const OUTPUT_HEIGHT = 563;

        // --- 事件監聽 ---

        // 1. 圖片上傳
        document.getElementById('bg-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    bgImgEl.src = event.target.result;
                    bgImgEl.style.display = 'block';
                    // 重置位置
                    state.bgSrc = event.target.result;
                    state.posX = 0;
                    state.posY = 0;
                    state.pendingMosaicBox = null;
                    state.savedMosaicBox = null;
                    state.isMosaicSelectionMode = false;
                    updatePreview();
                };
                reader.readAsDataURL(file);
            }
        });

        // 2. 數值滑桿監聽
        function updateStateFromInputs() {
            state.scale = parseInt(inpScale.value) / 100;
            state.brightness = parseInt(inpBright.value);
            state.saturation = parseInt(inpSat.value);
            
            document.getElementById('val-scale').innerText = inpScale.value + '%';
            document.getElementById('val-brightness').innerText = inpBright.value + '%';
            document.getElementById('val-saturation').innerText = inpSat.value + '%';
            
            state.textPaddingBottomPx = parseInt(inpTextY.value);
            state.bottomFontSize = parseInt(inpTextSize.value);
            state.topFontSize = parseInt(inpTopTextSize.value);
            
            document.getElementById('val-text-y').innerText = inpTextY.value + 'px';
            document.getElementById('val-text-size').innerText = inpTextSize.value + 'px';
            document.getElementById('val-top-text-size').innerText = inpTopTextSize.value + 'px';
            
            updatePreview();
        }

        [
            inpScale,
            inpBright,
            inpSat,
            inpTextY,
            inpTextSize,
            inpTopTextSize
        ].forEach(el => {
            el.addEventListener('input', updateStateFromInputs);
        });

        inpMosaicCellSize.addEventListener('input', () => {
            setMosaicCellSize(inpMosaicCellSize.value, { source: 'number' });
        });
        inpMosaicCellSize.addEventListener('change', () => {
            setMosaicCellSize(inpMosaicCellSize.value, { source: 'number', commit: true });
        });
        inpMosaicCellSize.addEventListener('blur', () => {
            setMosaicCellSize(inpMosaicCellSize.value, { source: 'number', commit: true });
        });
        inpMosaicDialogSlider.addEventListener('input', () => {
            setMosaicCellSize(inpMosaicDialogSlider.value, { source: 'slider', commit: true });
        });
        inpMosaicDialogSlider.addEventListener('change', () => {
            setMosaicCellSize(inpMosaicDialogSlider.value, { source: 'slider', commit: true });
        });

        inpMosaicPreview.addEventListener('change', renderMosaicPreview);

        btnMosaicSelect.addEventListener('click', () => {
            if (!state.bgSrc) return;
            state.isMosaicSelectionMode = true;
            state.pendingMosaicBox = null;
            previewContainer.style.cursor = 'default';
            hideMosaicDialog();
            updatePreview();
        });

        btnMosaicOk.addEventListener('click', async () => {
            if (!state.pendingMosaicBox) return;
            setMosaicCellSize(inpMosaicCellSize.value, { source: 'number', commit: true });
            btnMosaicOk.disabled = true;
            const saved = await saveMosaicToBaseImage(state.pendingMosaicBox);
            state.savedMosaicBox = saved ? state.pendingMosaicBox : null;
            state.pendingMosaicBox = null;
            state.isMosaicSelectionMode = false;
            btnMosaicOk.disabled = false;
            hideMosaicDialog();
            previewContainer.style.cursor = 'default';
            updatePreview();
        });

        [btnMosaicReset, btnMosaicClose, btnMosaicClear].forEach(btn => {
            btn.addEventListener('click', resetMosaicSelection);
        });

        function resetMosaicSelection() {
            state.pendingMosaicBox = null;
            state.savedMosaicBox = null;
            state.isMosaicSelectionMode = false;
            hideMosaicDialog();
            previewContainer.style.cursor = 'default';
            updatePreview();
        }

        // 3. 文字輸入同步
        inpTopText.addEventListener('input', (e) => {
            displayTop.innerText = e.target.value;
        });

        // 下標題 ContentEditable 監聽
        const observer = new MutationObserver((mutations) => {
            syncBottomText();
        });
        observer.observe(inpBottomText, { characterData: true, childList: true, subtree: true, attributes: true });
        
        inpBottomText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
            }
        });

        // 新增：貼上時只保留純文字
        inpBottomText.addEventListener('paste', (e) => {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text');
            document.execCommand('insertText', false, text);
        });
        
        syncBottomText();

        function syncBottomText() {
            displayBottom.innerHTML = inpBottomText.innerHTML;
        }

        // 4. 文字變色邏輯
        window.setTextColor = function(colorType) {
            const selection = window.getSelection();
            if (!selection.rangeCount) return;

            const range = selection.getRangeAt(0);
            const container = inpBottomText;
            if (!container.contains(range.commonAncestorContainer)) return;

            const span = document.createElement('span');
            if (colorType === 'cyan') {
                span.className = 'highlight-cyan';
                span.style.color = '#23f8b5'; 
            } else if (colorType === 'yellow') {
                span.className = 'highlight-yellow';
                span.style.color = '#fef337'; 
            } else {
                document.execCommand('removeFormat', false, null);
                return;
            }

            if (!selection.isCollapsed) {
                document.execCommand('removeFormat', false, null);
                const text = selection.toString();
                span.innerText = text;
                range.deleteContents();
                range.insertNode(span);
                selection.removeAllRanges();
            }
            syncBottomText();
        };

        // 5. 圖片拖曳
        previewContainer.addEventListener('mousedown', startDrag);
        previewContainer.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag, {passive: false});
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function startDrag(e) {
            if (!state.bgSrc) return;
            e.preventDefault();
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            if (state.isMosaicSelectionMode) {
                const point = getCanvasPoint(clientX, clientY);
                const box = clampMosaicBox({ x: point.x, y: point.y, width: 1, height: 1 });
                state.isSelectingMosaic = true;
                state.mosaicStartX = box.x;
                state.mosaicStartY = box.y;
                state.pendingMosaicBox = box;
                state.savedMosaicBox = null;
                updatePreview();
                return;
            }

            state.isDragging = true;
            state.startX = clientX - state.posX;
            state.startY = clientY - state.posY;
            previewContainer.style.cursor = 'grabbing';
        }

        function drag(e) {
            if (!state.isDragging && !state.isSelectingMosaic) return;
            e.preventDefault();
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;

            if (state.isSelectingMosaic) {
                const point = getCanvasPoint(clientX, clientY);
                const x = Math.min(state.mosaicStartX, point.x);
                const y = Math.min(state.mosaicStartY, point.y);
                const width = Math.abs(point.x - state.mosaicStartX) || 1;
                const height = Math.abs(point.y - state.mosaicStartY) || 1;

                state.pendingMosaicBox = clampMosaicBox({ x, y, width, height });
                updatePreview();
                return;
            }

            state.posX = clientX - state.startX;
            state.posY = clientY - state.startY;
            updatePreview();
        }

        function endDrag() {
            const didSelectMosaic = state.isSelectingMosaic;
            state.isDragging = false;
            state.isSelectingMosaic = false;
            previewContainer.style.cursor = 'default';
            updatePreview();
            if (didSelectMosaic && state.pendingMosaicBox) {
                showMosaicDialog();
                renderMosaicPreview();
            }
        }

        function getCanvasPoint(clientX, clientY) {
            const rect = previewContainer.getBoundingClientRect();
            return {
                x: Math.max(0, Math.min(OUTPUT_WIDTH - 1, Math.round(((clientX - rect.left) / rect.width) * OUTPUT_WIDTH))),
                y: Math.max(0, Math.min(OUTPUT_HEIGHT - 1, Math.round(((clientY - rect.top) / rect.height) * OUTPUT_HEIGHT)))
            };
        }

        // --- 更新預覽 ---
        function updatePreview() {
            if (bgImgEl.src) {
                bgImgEl.style.transform = `translate(calc(-50% + ${state.posX}px), calc(-50% + ${state.posY}px)) scale(${state.scale})`;
                bgImgEl.style.filter = `brightness(${state.brightness}%) saturate(${state.saturation}%)`;
                bgImgEl.style.cursor = state.isMosaicSelectionMode ? 'default' : 'move';
            }

            const paddingPct = (state.textPaddingBottomPx / 1000) * 100;
            textLayer.style.paddingBottom = `${paddingPct}%`;
            
            const containerWidth = previewContainer.clientWidth;
            const scaleRatio = containerWidth ? (containerWidth / 1000) : 1;
            
            const scaledBottomSize = state.bottomFontSize * scaleRatio;
            displayBottom.style.fontSize = `${scaledBottomSize}px`;
            
            const scaledTopSize = state.topFontSize * scaleRatio;
            displayTop.style.fontSize = `${scaledTopSize}px`;

            // 設定預覽區的上標與下標間距 (固定 5px 的比例)
            const scaledMargin = 5 * scaleRatio;
            displayTop.style.marginBottom = `${scaledMargin}px`;
            
            // 上標下移 5px (預覽用 transform)
            const moveDownPx = 5 * scaleRatio;
            displayTop.style.transform = `translateY(${moveDownPx}px)`;

            renderMosaicPreview();
            updateMosaicSelectionBox();
            updateMosaicControls();
        }

        function clampMosaicBox(box) {
            const x = Math.max(0, Math.min(OUTPUT_WIDTH - 1, Math.round(box.x)));
            const y = Math.max(0, Math.min(OUTPUT_HEIGHT - 1, Math.round(box.y)));
            const width = Math.max(1, Math.min(OUTPUT_WIDTH - x, Math.round(box.width)));
            const height = Math.max(1, Math.min(OUTPUT_HEIGHT - y, Math.round(box.height)));

            return { x, y, width, height };
        }

        function updateMosaicSelectionBox() {
            const box = state.pendingMosaicBox || state.savedMosaicBox;
            if (!box || (!state.isMosaicSelectionMode && !state.pendingMosaicBox)) {
                mosaicSelectionBox.style.display = 'none';
                return;
            }

            const rect = previewContainer.getBoundingClientRect();
            const scaleX = rect.width / OUTPUT_WIDTH;
            const scaleY = rect.height / OUTPUT_HEIGHT;

            mosaicSelectionBox.style.display = 'block';
            mosaicSelectionBox.style.left = `${box.x * scaleX}px`;
            mosaicSelectionBox.style.top = `${box.y * scaleY}px`;
            mosaicSelectionBox.style.width = `${box.width * scaleX}px`;
            mosaicSelectionBox.style.height = `${box.height * scaleY}px`;
        }

        function updateMosaicControls() {
            btnMosaicClear.classList.toggle('hidden', !state.pendingMosaicBox);
            btnMosaicSelect.disabled = !state.bgSrc;
            btnMosaicSelect.classList.toggle('opacity-50', !state.bgSrc);

            if (!state.bgSrc) {
                mosaicStatus.innerText = '請先上傳圖片。';
            } else if (state.pendingMosaicBox) {
                mosaicStatus.innerText = '區域已選取，確認後會寫入目前圖片。';
            } else if (state.isMosaicSelectionMode) {
                mosaicStatus.innerText = '在圖片上拖曳選取要馬賽克的位置。';
            } else if (state.savedMosaicBox) {
                mosaicStatus.innerText = '馬賽克已儲存到圖片。可繼續選取下一個區域。';
            } else {
                mosaicStatus.innerText = '點選「選取區域」後，在圖片上拖曳要馬賽克的位置。';
            }
        }

        function clearPreviewMosaic() {
            const ctx = previewMosaicCanvas.getContext('2d');
            const canvasWidth = OUTPUT_WIDTH;
            const canvasHeight = OUTPUT_HEIGHT;

            if (previewMosaicCanvas.width !== canvasWidth || previewMosaicCanvas.height !== canvasHeight) {
                previewMosaicCanvas.width = canvasWidth;
                previewMosaicCanvas.height = canvasHeight;
            }

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, previewMosaicCanvas.width, previewMosaicCanvas.height);
        }

        function renderMosaicPreview() {
            clearPreviewMosaic();
            if (!state.bgSrc || !state.pendingMosaicBox || !inpMosaicPreview.checked || !bgImgEl.complete) return;

            const imageWidth = bgImgEl.naturalWidth || bgImgEl.width;
            const imageHeight = bgImgEl.naturalHeight || bgImgEl.height;
            const imageBox = mapOutputBoxToImageBox(state.pendingMosaicBox, imageWidth, imageHeight);
            if (!imageBox) return;

            const sourceCanvas = document.createElement('canvas');
            sourceCanvas.width = imageWidth;
            sourceCanvas.height = imageHeight;
            const sourceCtx = sourceCanvas.getContext('2d');
            sourceCtx.drawImage(bgImgEl, 0, 0, imageWidth, imageHeight);
            applyMosaic(sourceCanvas, imageBox.x, imageBox.y, imageBox.width, imageBox.height, state.mosaicIntensity);

            const previewCtx = previewMosaicCanvas.getContext('2d');
            const workingCanvas = document.createElement('canvas');
            workingCanvas.width = previewMosaicCanvas.width;
            workingCanvas.height = previewMosaicCanvas.height;
            const workingCtx = workingCanvas.getContext('2d');

            drawBackgroundOnCanvas(workingCtx, sourceCanvas);
            previewCtx.drawImage(
                workingCanvas,
                state.pendingMosaicBox.x,
                state.pendingMosaicBox.y,
                state.pendingMosaicBox.width,
                state.pendingMosaicBox.height,
                state.pendingMosaicBox.x,
                state.pendingMosaicBox.y,
                state.pendingMosaicBox.width,
                state.pendingMosaicBox.height
            );
        }

        function setMosaicCellSize(value, options = {}) {
            const rawValue = String(value).trim();
            const parsedValue = parseInt(rawValue, 10);
            if (!Number.isFinite(parsedValue)) {
                if (options.commit) {
                    syncMosaicCellSizeInputs(state.mosaicIntensity);
                }
                return;
            }

            const nextValue = Math.max(2, Math.min(80, parsedValue));
            state.mosaicIntensity = nextValue;
            syncMosaicCellSizeInputs(nextValue, options.source);
            queueMosaicPreviewRender();
        }

        function syncMosaicCellSizeInputs(value, source) {
            if (source !== 'number' || document.activeElement !== inpMosaicCellSize) {
                inpMosaicCellSize.value = value;
            }
            if (source !== 'slider') {
                inpMosaicDialogSlider.value = value;
            }
        }

        function queueMosaicPreviewRender() {
            if (state.pendingMosaicBox && inpMosaicPreview.checked) {
                requestAnimationFrame(renderMosaicPreview);
            }
        }

        function showMosaicDialog() {
            syncMosaicCellSizeInputs(state.mosaicIntensity);
            inpMosaicPreview.checked = true;
            mosaicDialog.classList.remove('hidden');
        }

        function hideMosaicDialog() {
            mosaicDialog.classList.add('hidden');
            clearPreviewMosaic();
        }
        
        window.addEventListener('resize', updatePreview);

        // --- Canvas 輸出 ---
        async function downloadImage() {
            const canvas = document.getElementById('export-canvas');
            const ctx = canvas.getContext('2d'); 
            const loadingMsg = document.getElementById('loading-msg');
            
            loadingMsg.classList.remove('hidden');

            // --- 新增：平滑處理設定 ---
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            try {
                await Promise.all([
                    document.fonts.load(`600 ${state.topFontSize}px "Noto Sans TC"`), // 改為 600
                    document.fonts.load(`800 ${state.bottomFontSize}px "Noto Sans TC"`)
                ]);
            } catch (e) {
                console.log("Font loading failed, relying on system fallback", e);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (state.bgSrc) {
                const img = new Image();
                img.src = state.bgSrc;
                await new Promise(r => img.onload = r);

                drawBackgroundOnCanvas(ctx, img);
            }

            if (maskImageObj.complete) {
                ctx.drawImage(maskImageObj, 0, 0, canvas.width, canvas.height);
            } else {
                await new Promise(r => maskImageObj.onload = r);
                ctx.drawImage(maskImageObj, 0, 0, canvas.width, canvas.height);
            }

            drawTextOnCanvas(ctx);

            const link = document.createElement('a');
            link.download = 'social-cover-' + Date.now() + '.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
            
            loadingMsg.classList.add('hidden');
        }

        function drawTextOnCanvas(ctx) {
            const canvas = ctx.canvas;
            
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0); 
            ctx.textAlign = 'start'; 
            ctx.textBaseline = 'alphabetic';
            
            const paddingBottom = state.textPaddingBottomPx;
            const bottomFontSize = state.bottomFontSize;
            const topFontSize = state.topFontSize;
            const gap = 5; 
            
            // --- 下標 (Bottom Label) ---
            ctx.font = `800 ${bottomFontSize}px "Noto Sans TC", sans-serif`;
            
            // 1. 獲取清理過的節點 (去除前後空白)
            const bottomTextNodes = parseContentEditable(inpBottomText);
            
            let currentY = canvas.height - paddingBottom;
            const bottomStartY = currentY - (bottomFontSize * 0.3);
            
            // 2. 計算總寬度
            let totalLineWidth = 0;
            bottomTextNodes.forEach(node => {
                 totalLineWidth += ctx.measureText(node.text).width;
            });
            
            // 3. 計算起始 X (置中)
            // 使用 Math.round 避免亞像素模糊
            let cursorX = Math.round((canvas.width - totalLineWidth) / 2);
            
            // 4. 繪製
            bottomTextNodes.forEach(node => {
                ctx.fillStyle = node.color;
                ctx.shadowColor = 'rgba(0,0,0,0.7)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 2;
                ctx.font = `800 ${bottomFontSize}px "Noto Sans TC", sans-serif`;
                ctx.textAlign = 'left'; 
                
                ctx.fillText(node.text, cursorX, bottomStartY);
                cursorX += ctx.measureText(node.text).width;
            });

            // --- 上標 (Top Label) ---
            const topText = inpTopText.value.trim();
            const visualGap = 5 + (bottomFontSize * 0.15) + (topFontSize * 0.15);
            // +5 讓上標下移 5px
            const topTextY = bottomStartY - (bottomFontSize * 0.85) - visualGap + 5;
            
            // 更改為字重 600
            ctx.font = `600 ${topFontSize}px "Noto Sans TC", sans-serif`;
            ctx.fillStyle = 'white';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetY = 2;
            
            if (ctx.letterSpacing !== undefined) {
                ctx.letterSpacing = "0.05em"; 
            }
            
            // 原生置中，座標鎖死 500
            ctx.textAlign = 'center'; 
            ctx.fillText(topText, 500, topTextY);
            
            ctx.restore();
        }

        function drawBackgroundOnCanvas(ctx, img) {
            const placement = getImagePlacementOnCanvas(ctx.canvas, img);

            ctx.save();
            ctx.filter = `brightness(${state.brightness}%) saturate(${state.saturation}%)`;
            ctx.translate(placement.centerX, placement.centerY);
            ctx.scale(placement.scale, placement.scale);
            ctx.drawImage(
                img,
                -placement.imageWidth / 2,
                -placement.imageHeight / 2,
                placement.imageWidth,
                placement.imageHeight
            );
            ctx.restore();
        }

        function getPreviewToOutputScale() {
            const rect = previewContainer.getBoundingClientRect();
            return {
                x: rect.width ? OUTPUT_WIDTH / rect.width : 1,
                y: rect.height ? OUTPUT_HEIGHT / rect.height : 1
            };
        }

        function getImagePlacementOnCanvas(canvas, img) {
            const imageWidth = img.naturalWidth || img.width;
            const imageHeight = img.naturalHeight || img.height;
            const previewToOutput = getPreviewToOutputScale();
            const outputToCanvas = {
                x: canvas.width / OUTPUT_WIDTH,
                y: canvas.height / OUTPUT_HEIGHT
            };

            return {
                imageWidth,
                imageHeight,
                scale: state.scale,
                centerX: (OUTPUT_WIDTH / 2 + state.posX * previewToOutput.x) * outputToCanvas.x,
                centerY: (OUTPUT_HEIGHT / 2 + state.posY * previewToOutput.y) * outputToCanvas.y
            };
        }

        async function saveMosaicToBaseImage(outputBox) {
            if (!state.bgSrc) return false;

            const img = new Image();
            img.src = state.bgSrc;
            await new Promise(resolve => {
                img.onload = resolve;
                img.onerror = resolve;
            });

            const imageWidth = img.naturalWidth || img.width;
            const imageHeight = img.naturalHeight || img.height;
            if (!imageWidth || !imageHeight) return false;

            const imageBox = mapOutputBoxToImageBox(outputBox, imageWidth, imageHeight);
            if (!imageBox) return false;

            const canvas = document.createElement('canvas');
            canvas.width = imageWidth;
            canvas.height = imageHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, imageWidth, imageHeight);
            applyMosaic(canvas, imageBox.x, imageBox.y, imageBox.width, imageBox.height, state.mosaicIntensity);

            state.bgSrc = canvas.toDataURL('image/png');
            bgImgEl.src = state.bgSrc;
            return true;
        }

        function mapOutputBoxToImageBox(outputBox, imageWidth, imageHeight) {
            const previewToOutput = getPreviewToOutputScale();
            const imageCenterX = OUTPUT_WIDTH / 2 + state.posX * previewToOutput.x;
            const imageCenterY = OUTPUT_HEIGHT / 2 + state.posY * previewToOutput.y;
            const imageLeft = imageCenterX - (imageWidth * state.scale) / 2;
            const imageTop = imageCenterY - (imageHeight * state.scale) / 2;

            const outputLeft = Math.max(outputBox.x, imageLeft);
            const outputTop = Math.max(outputBox.y, imageTop);
            const outputRight = Math.min(outputBox.x + outputBox.width, imageLeft + imageWidth * state.scale);
            const outputBottom = Math.min(outputBox.y + outputBox.height, imageTop + imageHeight * state.scale);

            if (outputRight <= outputLeft || outputBottom <= outputTop) return null;

            const sourceX = Math.floor((outputLeft - imageLeft) / state.scale);
            const sourceY = Math.floor((outputTop - imageTop) / state.scale);
            const sourceRight = Math.ceil((outputRight - imageLeft) / state.scale);
            const sourceBottom = Math.ceil((outputBottom - imageTop) / state.scale);
            const clampedX = Math.max(0, Math.min(imageWidth - 1, sourceX));
            const clampedY = Math.max(0, Math.min(imageHeight - 1, sourceY));
            const clampedRight = Math.max(clampedX + 1, Math.min(imageWidth, sourceRight));
            const clampedBottom = Math.max(clampedY + 1, Math.min(imageHeight, sourceBottom));

            return {
                x: clampedX,
                y: clampedY,
                width: clampedRight - clampedX,
                height: clampedBottom - clampedY
            };
        }

        function applyMosaic(image, startX, startY, width, height, mosaicIntensity) {
            const sourceCanvas = image instanceof HTMLCanvasElement ? image : document.createElement('canvas');
            const ctx = sourceCanvas.getContext('2d');

            if (!(image instanceof HTMLCanvasElement)) {
                sourceCanvas.width = image.naturalWidth || image.width;
                sourceCanvas.height = image.naturalHeight || image.height;
                ctx.drawImage(image, 0, 0);
            }

            const x = Math.max(0, Math.min(sourceCanvas.width - 1, Math.floor(startX)));
            const y = Math.max(0, Math.min(sourceCanvas.height - 1, Math.floor(startY)));
            const mosaicWidth = Math.max(1, Math.min(sourceCanvas.width - x, Math.floor(width)));
            const mosaicHeight = Math.max(1, Math.min(sourceCanvas.height - y, Math.floor(height)));
            const blockSize = Math.max(1, Math.floor(mosaicIntensity));

            ctx.save();
            ctx.imageSmoothingEnabled = false;

            for (let blockY = y; blockY < y + mosaicHeight; blockY += blockSize) {
                for (let blockX = x; blockX < x + mosaicWidth; blockX += blockSize) {
                    const sampleX = Math.min(blockX + Math.floor(blockSize / 2), x + mosaicWidth - 1);
                    const sampleY = Math.min(blockY + Math.floor(blockSize / 2), y + mosaicHeight - 1);
                    const [red, green, blue, alpha] = ctx.getImageData(sampleX, sampleY, 1, 1).data;
                    const drawWidth = Math.min(blockSize, x + mosaicWidth - blockX);
                    const drawHeight = Math.min(blockSize, y + mosaicHeight - blockY);

                    ctx.fillStyle = `rgba(${red}, ${green}, ${blue}, ${alpha / 255})`;
                    ctx.fillRect(blockX, blockY, drawWidth, drawHeight);
                }
            }

            ctx.restore();
            return sourceCanvas;
        }

        // 解析並清理 ContentEditable 內容
        function parseContentEditable(element) {
            let nodes = [];
            
            function traverse(node, style = { color: 'white' }) {
                if (node.nodeType === Node.TEXT_NODE) {
                    let cleanText = node.textContent.replace(/\n/g, ' '); 
                    if (cleanText.length > 0) {
                        nodes.push({ text: cleanText, color: style.color });
                    }
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    let newStyle = { ...style };
                    if (node.style.color) newStyle.color = node.style.color;
                    if (node.classList.contains('highlight-cyan')) newStyle.color = '#23f8b5';
                    if (node.classList.contains('highlight-yellow')) newStyle.color = '#fef337';
                    
                    node.childNodes.forEach(child => traverse(child, newStyle));
                }
            }
            
            element.childNodes.forEach(node => traverse(node));
            
            if (nodes.length > 0) {
                nodes[0].text = nodes[0].text.trimStart();
            }
            if (nodes.length > 0) {
                const lastIdx = nodes.length - 1;
                nodes[lastIdx].text = nodes[lastIdx].text.trimEnd();
            }
            
            return nodes.filter(n => n.text.length > 0);
        }
        
        setTimeout(updatePreview, 100);
        
    </script>
</body>
